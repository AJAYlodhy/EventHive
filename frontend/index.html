    ];

    const INITIAL_REGISTRATIONS = [
      {
        id: "REG-901",
        studentId: "STU-2026-042",
        eventId: "EVT-101",
        registrationDate: "2026-08-20",
        status: "Confirmed"
      },
      {
        id: "REG-902",
        studentId: "STU-2026-042",
        eventId: "EVT-098",
        registrationDate: "2026-07-15",
        status: "Attended"
      }
    ];

    const INITIAL_NOTIFICATIONS = [
      {
        id: "NOTIF-1",
        title: "Registration Confirmed!",
        message: "You are registered for 'HackHive 2026: Annual Campus Hackathon'.",
        time: "2 days ago",
        read: false,
        type: "registration"
      },
      {
        id: "NOTIF-2",
        title: "Event Reminder",
        message: "Tech Career & Internship Readiness Seminar is happening on August 28th.",
        time: "Yesterday",
        read: false,
        type: "reminder"
      },
      {
        id: "NOTIF-3",
        title: "New Event Announced",
        message: "AI & Deep Learning Hands-on Workshop is now open for registration.",
        time: "3 days ago",
        read: true,
        type: "announcement"
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Navigation state: 'dashboard', 'browse', 'my-events', 'profile'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Core State with localStorage fallback
      const [student, setStudent] = useState(() => {
        const saved = localStorage.getItem('eh_student');
        return saved ? JSON.parse(saved) : INITIAL_STUDENT;
      });

      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('eh_events');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      const [registrations, setRegistrations] = useState(() => {
        const saved = localStorage.getItem('eh_registrations');
        return saved ? JSON.parse(saved) : INITIAL_REGISTRATIONS;
      });

      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('eh_notifications');
        return saved ? JSON.parse(saved) : INITIAL_NOTIFICATIONS;
      });

      // Modals & UI States
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [showNotifications, setShowNotifications] = useState(false);
      const [toast, setToast] = useState(null);

      // Filters for Browse Events
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedDepartment, setSelectedDepartment] = useState('All');
      const [selectedDateFilter, setSelectedDateFilter] = useState('All');

      // Sync state with localStorage
      useEffect(() => {
        localStorage.setItem('eh_student', JSON.stringify(student));
      }, [student]);

      useEffect(() => {
        localStorage.setItem('eh_events', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('eh_registrations', JSON.stringify(registrations));
      }, [registrations]);

      useEffect(() => {
        localStorage.setItem('eh_notifications', JSON.stringify(notifications));
      }, [notifications]);

      // Trigger Lucide icon replacements on render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Show Toast Notification
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Registration Check Helper
      const isRegistered = (eventId) => {
        return registrations.some(r => r.studentId === student.id && r.eventId === eventId && r.status !== 'Cancelled');
      };

      // Get Registration Status
      const getRegistrationStatus = (eventId) => {
        const reg = registrations.find(r => r.studentId === student.id && r.eventId === eventId);
        return reg ? reg.status : null;
      };

      // Handle Event Registration
      const handleRegister = (eventId) => {
        const event = events.find(e => e.id === eventId);
        if (!event) return;

        if (isRegistered(eventId)) {
          showToast('You are already registered for this event.', 'warning');
          return;
        }

        if (event.availableSeats <= 0) {
          showToast('Sorry, this event is fully booked.', 'error');
          return;
        }

        // Decrement seat
        setEvents(prev => prev.map(e => e.id === eventId ? { ...e, availableSeats: Math.max(0, e.availableSeats - 1) } : e));

        // Add registration
        const newReg = {
          id: `REG-${Date.now()}`,
          studentId: student.id,
          eventId: eventId,
          registrationDate: new Date().toISOString().split('T')[0],
          status: 'Confirmed'
        };
        setRegistrations(prev => [newReg, ...prev]);

        // Add Notification
        const newNotif = {
          id: `NOTIF-${Date.now()}`,
          title: 'Registration Confirmed!',
          message: `You successfully registered for "${event.title}".`,
          time: 'Just now',
          read: false,
          type: 'registration'
        };
        setNotifications(prev => [newNotif, ...prev]);

        showToast(`Registered successfully for ${event.title}!`, 'success');
      };

      // Handle Cancel Registration
      const handleCancelRegistration = (eventId) => {
        const reg = registrations.find(r => r.studentId === student.id && r.eventId === eventId && r.status === 'Confirmed');
        if (!reg) return;

        // Restore seat
        setEvents(prev => prev.map(e => e.id === eventId ? { ...e, availableSeats: e.availableSeats + 1 } : e));

        // Update registration status to Cancelled
        setRegistrations(prev => prev.map(r => (r.studentId === student.id && r.eventId === eventId && r.status === 'Confirmed') ? { ...r, status: 'Cancelled' } : r));

        const event = events.find(e => e.id === eventId);
        const newNotif = {
          id: `NOTIF-${Date.now()}`,
          title: 'Registration Cancelled',
          message: `Your registration for "${event ? event.title : 'Event'}" has been cancelled.`,
          time: 'Just now',
          read: false,
          type: 'cancellation'
        };
        setNotifications(prev => [newNotif, ...prev]);

        showToast('Registration cancelled successfully.', 'info');
      };

      // Statistics calculations
      const stats = useMemo(() => {
        const activeRegs = registrations.filter(r => r.studentId === student.id && r.status === 'Confirmed');
        const pastRegs = registrations.filter(r => r.studentId === student.id && (r.status === 'Attended' || (events.find(e => e.id === r.eventId)?.status === 'Completed' && r.status !== 'Cancelled')));
        const availableCount = events.filter(e => e.status !== 'Completed').length;

        return {
          registered: activeRegs.length,
          upcoming: activeRegs.length,
          completed: pastRegs.length,
          available: availableCount
        };
      }, [registrations, events, student.id]);

      // Filtered Events for Browse
      const filteredEvents = useMemo(() => {
        return events.filter(evt => {
          // Search query filter
          const matchesSearch = searchQuery === '' ||
            evt.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            evt.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
            evt.venue.toLowerCase().includes(searchQuery.toLowerCase()) ||
            evt.organizer.toLowerCase().includes(searchQuery.toLowerCase());

          // Category filter
          const matchesCategory = selectedCategory === 'All' || evt.category === selectedCategory;

          // Department filter
          const matchesDepartment = selectedDepartment === 'All' || evt.department === selectedDepartment || evt.department === 'All Departments';

          // Date filter
          let matchesDate = true;
          const todayStr = "2026-08-22";
          if (selectedDateFilter === 'Upcoming') {
            matchesDate = evt.date >= todayStr;
          } else if (selectedDateFilter === 'This Month') {
            matchesDate = evt.date.startsWith('2026-08') || evt.date.startsWith('2026-09');
          }

          return matchesSearch && matchesCategory && matchesDepartment && matchesDate;
        });
      }, [events, searchQuery, selectedCategory, selectedDepartment, selectedDateFilter]);

      // Student's registered events with event object attached
      const myRegisteredEvents = useMemo(() => {
        return registrations
          .filter(r => r.studentId === student.id)
          .map(r => ({
            ...r,
            event: events.find(e => e.id === r.eventId)
          }))
          .filter(r => r.event);
      }, [registrations, events, student.id]);

      const upcomingMyEvents = myRegisteredEvents.filter(r => r.status === 'Confirmed');
      const pastMyEvents = myRegisteredEvents.filter(r => r.status === 'Attended' || r.status === 'Cancelled' || (r.event && r.event.status === 'Completed'));

      const unreadNotificationsCount = notifications.filter(n => !n.read).length;

      const markAllNotificationsAsRead = () => {
        setNotifications(prev => prev.map(n => ({ ...n, read: true })));
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          {/* TOP NAVBAR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16">
                {/* Logo & Portal Badge */}
                <div className="flex items-center space-x-3">

                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                      <i data-lucide="calendar" className="w-6 h-6"></i>
                    </div>
                    <div>
                      <span className="text-xl font-bold font-heading tracking-tight text-slate-900">Event<span className="text-brand-600">Hive</span></span>
                      <span className="hidden sm:inline-block ml-2 px-2 py-0.5 text-xs font-semibold bg-brand-50 text-brand-700 border border-brand-200 rounded-full">Student Portal</span>
                    </div>
                  </div>
                </div>

                {/* Desktop Navigation Links */}
                <nav className="hidden md:flex items-center space-x-1">
                  <button
                    onClick={() => setActiveTab('dashboard')}
                    className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                  >
                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                    <span>Dashboard</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('browse')}
                    className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-colors ${activeTab === 'browse' ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                  >
                    <i data-lucide="compass" className="w-4 h-4"></i>
                    <span>Browse Events</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('my-events')}
                    className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-colors ${activeTab === 'my-events' ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                  >
                    <i data-lucide="ticket" className="w-4 h-4"></i>
                    <span>My Events</span>
                    {upcomingMyEvents.length > 0 && (
                      <span className="ml-1.5 px-1.5 py-0.2 bg-brand-600 text-white text-xs font-bold rounded-full">{upcomingMyEvents.length}</span>
                    )}
                  </button>
                  <button
                    onClick={() => setActiveTab('profile')}
                    className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-colors ${activeTab === 'profile' ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                  >
                    <i data-lucide="user" className="w-4 h-4"></i>
                    <span>Profile</span>
                  </button>
                </nav>

                {/* Right Actions: Notifications & Student Chip */}
                <div className="flex items-center space-x-3">
                  {/* Notifications Popover Toggle */}
                  <div className="relative">
                    <button
                      onClick={() => setShowNotifications(!showNotifications)}
                      className="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg relative transition-colors"
                      title="Notifications"
                    >
                      <i data-lucide="bell" className="w-5 h-5"></i>
                      {unreadNotificationsCount > 0 && (
                        <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white"></span>
                      )}
                    </button>

                    {/* Notifications Dropdown */}
                    {showNotifications && (
                      <div className="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-xl shadow-xl border border-slate-200 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150">
                        <div className="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between">
                          <div className="flex items-center space-x-2">
                            <span className="font-semibold text-slate-800 text-sm">Notifications</span>
                            {unreadNotificationsCount > 0 && (
                              <span className="px-2 py-0.5 bg-brand-100 text-brand-700 text-xs font-semibold rounded-full">{unreadNotificationsCount} new</span>
                            )}
                          </div>
                          {unreadNotificationsCount > 0 && (
                            <button
                              onClick={markAllNotificationsAsRead}
                              className="text-xs text-brand-600 hover:text-brand-800 font-medium"
                            >
                              Mark all as read
                            </button>
                          )}
                        </div>
                        <div className="max-h-72 overflow-y-auto custom-scrollbar divide-y divide-slate-100">
                          {notifications.length === 0 ? (
                            <div className="p-6 text-center text-slate-500 text-sm">No notifications</div>
                          ) : (
                            notifications.map(notif => (
                              <div key={notif.id} className={`p-3.5 hover:bg-slate-50 transition-colors ${!notif.read ? 'bg-brand-50/40' : ''}`}>
                                <div className="flex items-start justify-between">
                                  <span className="font-medium text-slate-900 text-xs sm:text-sm">{notif.title}</span>
                                  <span className="text-[11px] text-slate-400">{notif.time}</span>
                                </div>
                                <p className="text-xs text-slate-600 mt-1">{notif.message}</p>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Student Profile Quick Avatar */}
                  <div
                    onClick={() => setActiveTab('profile')}
                    className="flex items-center space-x-2.5 pl-2 pr-3 py-1 bg-slate-100 hover:bg-slate-200 cursor-pointer rounded-full transition-colors"
                  >
                    <img
                      src={student.avatar}
                      alt={student.name}
                      className="w-7 h-7 rounded-full object-cover ring-2 ring-brand-500/20"
                    />
                    <div className="hidden sm:block text-left">
                      <div className="text-xs font-semibold text-slate-800 leading-tight">{student.name}</div>
                      <div className="text-[10px] text-slate-500">{student.rollNumber}</div>
                    </div>
                  </div>

                  {/* Mobile Menu Button */}
                  <button
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="md:hidden p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                  >
                    <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Navigation Drawer */}
            {mobileMenuOpen && (
              <div className="md:hidden border-t border-slate-200 bg-white px-4 pt-2 pb-4 space-y-1">

                                    onClick={() => handleRegister(event.id)}
                                    disabled={event.availableSeats <= 0}
                                    className="px-3.5 py-1.5 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 disabled:cursor-not-allowed rounded-lg shadow-sm transition-colors"
                                  >
                                    {event.availableSeats <= 0 ? 'Full' : 'Register Now'}
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* 3. MY EVENTS TAB */}
            {activeTab === 'my-events' && (
              <div className="space-y-6 animate-in fade-in duration-200">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h1 className="text-2xl font-bold font-heading text-slate-900">My Registered Events</h1>
                  <p className="text-xs sm:text-sm text-slate-500 mt-0.5">Manage your event attendance, confirmed passes, and registration history</p>
                </div>

                {/* Upcoming vs Past Tabs */}
                <div className="space-y-4">
                  <div className="border-b border-slate-200 flex space-x-6">
                    <button
                      className="pb-3 text-sm font-bold text-brand-600 border-b-2 border-brand-600 flex items-center space-x-2"
                    >
                      <i data-lucide="calendar" className="w-4 h-4"></i>
                      <span>Upcoming Events ({upcomingMyEvents.length})</span>
                    </button>
                    <button
                      className="pb-3 text-sm font-semibold text-slate-500 hover:text-slate-700 flex items-center space-x-2"
                    >
                      <i data-lucide="history" className="w-4 h-4"></i>
                      <span>Past / Completed ({pastMyEvents.length})</span>
                    </button>
                  </div>

                  {/* Upcoming List */}
                  {upcomingMyEvents.length === 0 ? (
                    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center">
                      <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 mb-3">
                        <i data-lucide="ticket" className="w-6 h-6"></i>
                      </div>
                      <h3 className="text-base font-bold text-slate-800">No active registrations</h3>
                      <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">You have not registered for any upcoming events yet.</p>
                      <button
                        onClick={() => setActiveTab('browse')}
                        className="mt-4 px-4 py-2 bg-brand-600 text-white text-xs font-semibold rounded-lg shadow-sm"
                      >
                        Browse Events
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {upcomingMyEvents.map(({ id, event, registrationDate }) => (
                        <div key={id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                          <div className="flex items-start space-x-4">
                            <img src={event.image} alt={event.title} className="w-20 h-20 rounded-lg object-cover flex-shrink-0" />
                            <div>
                              <div className="flex items-center space-x-2">
                                <span className="px-2 py-0.5 text-[10px] font-bold bg-emerald-100 text-emerald-800 rounded-full">
                                  CONFIRMED
                                </span>
                                <span className="text-xs text-slate-400">• Registered on {registrationDate}</span>
                              </div>
                              <h3 className="font-bold text-slate-900 text-base mt-1">{event.title}</h3>
                              <div className="flex flex-wrap items-center gap-y-1 gap-x-4 text-xs text-slate-600 mt-2">
                                <div className="flex items-center space-x-1.5">
                                  <i data-lucide="calendar" className="w-3.5 h-3.5 text-brand-600"></i>
                                  <span>{event.date}</span>
                                </div>
                                <div className="flex items-center space-x-1.5">
                                  <i data-lucide="clock" className="w-3.5 h-3.5 text-brand-600"></i>
                                  <span>{event.time}</span>
                                </div>
                                <div className="flex items-center space-x-1.5">
                                  <i data-lucide="map-pin" className="w-3.5 h-3.5 text-brand-600"></i>
                                  <span>{event.venue}</span>
                                </div>
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center space-x-2 w-full md:w-auto justify-end pt-3 md:pt-0 border-t md:border-t-0 border-slate-100">
                            <button
                              onClick={() => setSelectedEvent(event)}
                              className="px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
                            >
                              View Details
                            </button>
                            <button
                              onClick={() => handleCancelRegistration(event.id)}
                              className="px-3 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg transition-colors"
                            >
                              Cancel
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Past Events List Preview */}
                  {pastMyEvents.length > 0 && (
                    <div className="mt-8 pt-6 border-t border-slate-200">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">Past Activity & Attendance</h3>
                      <div className="space-y-3">
                        {pastMyEvents.map(({ id, event, status, registrationDate }) => (
                          <div key={id} className="bg-slate-50 rounded-xl border border-slate-200 p-4 flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-3">
                              <span className={`px-2 py-0.5 font-semibold rounded ${status === 'Attended' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-200 text-slate-700'}`}>
                                {status}
                              </span>
                              <div>
                                <span className="font-bold text-slate-800">{event.title}</span>
                                <span className="text-slate-400 ml-2">({event.date})</span>
                              </div>
                            </div>
                            <button
                              onClick={() => setSelectedEvent(event)}
                              className="text-brand-600 hover:text-brand-800 font-semibold"
                            >
                              Details
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 4. STUDENT PROFILE TAB */}
            {activeTab === 'profile' && (
              <ProfileSection student={student} setStudent={setStudent} showToast={showToast} stats={stats} />
            )}
          </main>

          {/* EVENT DETAILS MODAL */}
          {selectedEvent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-150">
              <div className="bg-white rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl border border-slate-200 max-h-[90vh] flex flex-col">
                {/* Modal Banner */}
                <div className="relative h-48 w-full bg-slate-900">
                  <img src={selectedEvent.image} alt={selectedEvent.title} className="w-full h-full object-cover opacity-90" />
                  <button
                    onClick={() => setSelectedEvent(null)}
                    className="absolute top-3 right-3 p-1.5 rounded-full bg-black/50 text-white hover:bg-black/80 transition-colors"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                  <div className="absolute bottom-3 left-4 flex gap-2">
                    <span className="px-2.5 py-1 text-xs font-semibold bg-white text-slate-900 rounded-md shadow-sm">
                      {selectedEvent.category}
                    </span>
                    <span className="px-2.5 py-1 text-xs font-semibold bg-brand-600 text-white rounded-md shadow-sm">
                      {selectedEvent.eventType}
                    </span>
                  </div>
                </div>

                {/* Modal Body */}
                <div className="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                  <div>
                    <span className="text-xs font-bold text-brand-600 uppercase tracking-wider">{selectedEvent.department}</span>
                    <h2 className="text-xl font-bold font-heading text-slate-900 mt-1">{selectedEvent.title}</h2>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                    {selectedEvent.description}
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <span className="text-slate-400 font-medium">Date & Schedule</span>
                      <div className="font-semibold text-slate-800 mt-0.5">{selectedEvent.date}</div>
                      <div className="text-slate-500">{selectedEvent.time}</div>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <span className="text-slate-400 font-medium">Campus Venue</span>
                      <div className="font-semibold text-slate-800 mt-0.5">{selectedEvent.venue}</div>
                      <div className="text-slate-500">Organized by {selectedEvent.organizer}</div>
                    </div>
                  </div>

                  <div className="p-3 bg-brand-50/50 rounded-xl border border-brand-100 flex items-center justify-between text-xs">
                    <div>
                      <span className="text-slate-500 font-medium">Seat Availability:</span>
                      <div className="text-sm font-bold text-slate-900 mt-0.5">
                        {selectedEvent.availableSeats} of {selectedEvent.totalSeats} seats remaining
                      </div>
                    </div>
                    <div>
                      {isRegistered(selectedEvent.id) ? (
                        <span className="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-full text-xs">
                          Registered
                        </span>
                      ) : selectedEvent.availableSeats <= 0 ? (
                        <span className="px-3 py-1 bg-rose-100 text-rose-800 font-bold rounded-full text-xs">
                          Fully Booked
                        </span>
                      ) : (
                        <span className="px-3 py-1 bg-brand-100 text-brand-800 font-bold rounded-full text-xs">
                          Open for Registration
                        </span>
                      )}
                    </div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-end space-x-3">
                  <button
                    onClick={() => setSelectedEvent(null)}
                    className="px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200 rounded-lg transition-colors"
                  >
                    Close
                  </button>
                  {isRegistered(selectedEvent.id) ? (
                    <button
                      onClick={() => {
                        handleCancelRegistration(selectedEvent.id);
                        setSelectedEvent(null);
                      }}
                      className="px-4 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg transition-colors"
                    >
                      Cancel Registration
                    </button>
                  ) : (
                    <button
                      onClick={() => {
                        handleRegister(selectedEvent.id);
                        setSelectedEvent(null);
                      }}
                      disabled={selectedEvent.availableSeats <= 0}
                      className="px-4 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 disabled:cursor-not-allowed rounded-lg shadow-sm transition-colors"
                    >
                      Confirm Registration
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TOAST ALERTS */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 animate-in slide-in-from-bottom-5 duration-200">
              <div className={`px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold flex items-center space-x-2.5 ${
                toast.type === 'success' ? 'bg-emerald-900 text-white border-emerald-800' :
                toast.type === 'error' ? 'bg-rose-900 text-white border-rose-800' :
                toast.type === 'warning' ? 'bg-amber-900 text-white border-amber-800' :
                'bg-slate-900 text-white border-slate-800'
              }`}>
                <i data-lucide={toast.type === 'success' ? 'check-circle-2' : toast.type === 'error' ? 'alert-circle' : 'info'} className="w-4 h-4"></i>
                <span>{toast.message}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- STUDENT PROFILE COMPONENT ---
    function ProfileSection({ student, setStudent, showToast, stats }) {
      const [isEditing, setIsEditing] = useState(false);
      const [formData, setFormData] = useState(student);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSave = (e) => {
        e.preventDefault();
        setStudent(formData);
        setIsEditing(false);
        showToast('Profile updated successfully!', 'success');
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6 animate-in fade-in duration-200">
          <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-200">
              <div className="flex items-center space-x-4">
                <img
                  src={student.avatar}
                  alt={student.name}
                  className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover ring-4 ring-brand-500/10"
                />
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold font-heading text-slate-900">{student.name}</h1>
                  <p className="text-xs sm:text-sm text-slate-500 mt-0.5">{student.rollNumber} • {student.department}</p>
                  <span className="inline-block mt-2 px-2.5 py-0.5 text-xs font-semibold bg-brand-50 text-brand-700 rounded-full border border-brand-200">
                    Student Member
                  </span>
                </div>
              </div>

              {!isEditing ? (
                <button
                  onClick={() => { setFormData(student); setIsEditing(true); }}
                  className="px-4 py-2 text-xs sm:text-sm font-semibold text-brand-600 bg-brand-50 hover:bg-brand-100 rounded-xl transition-colors inline-flex items-center space-x-1.5"
                >
                  <i data-lucide="edit-3" className="w-4 h-4"></i>
                  <span>Edit Profile</span>
                </button>
              ) : null}
            </div>

            {/* Profile Content / Edit Form */}
            {!isEditing ? (
              <div className="pt-6 space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm">
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <span className="text-slate-400 font-medium">Email Address</span>
                    <div className="font-semibold text-slate-800 mt-1">{student.email}</div>
                  </div>
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <span className="text-slate-400 font-medium">Student ID / Roll Number</span>
                    <div className="font-semibold text-slate-800 mt-1">{student.rollNumber}</div>
                  </div>
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <span className="text-slate-400 font-medium">Department</span>
                    <div className="font-semibold text-slate-800 mt-1">{student.department}</div>
                  </div>
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <span className="text-slate-400 font-medium">Academic Year & Semester</span>
                    <div className="font-semibold text-slate-800 mt-1">{student.year} • {student.semester}</div>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs sm:text-sm">
                  <span className="text-slate-400 font-medium">About / Bio</span>
                  <p className="font-medium text-slate-700 mt-1 leading-relaxed">{student.bio}</p>
                </div>

                {/* Campus Activity Summary */}
                <div className="pt-4 border-t border-slate-200">
                  <h3 className="text-sm font-bold font-heading text-slate-900 mb-3">Campus Participation Summary</h3>
                  <div className="grid grid-cols-3 gap-3 text-center">
                    <div className="p-3 bg-brand-50/50 rounded-xl border border-brand-100">
                      <span className="text-lg font-bold text-brand-700">{stats.registered}</span>
                      <p className="text-[11px] text-slate-500 mt-0.5">Registered</p>
                    </div>
                    <div className="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100">
                      <span className="text-lg font-bold text-indigo-700">{stats.completed}</span>
                      <p className="text-[11px] text-slate-500 mt-0.5">Completed</p>
                    </div>
                    <div className="p-3 bg-emerald-50/50 rounded-xl border border-emerald-100">
                      <span className="text-lg font-bold text-emerald-700">{stats.upcoming}</span>
                      <p className="text-[11px] text-slate-500 mt-0.5">Upcoming</p>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSave} className="pt-6 space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                    <input
                      type="text"
                      name="name"
                      value={formData.name}
                      onChange={handleChange}
                      required
                      className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                    <input
                      type="email"
                      name="email"
                      value={formData.email}
                      onChange={handleChange}
                      required
                      className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Student Roll Number</label>
                    <input
                      type="text"
                      name="rollNumber"
                      value={formData.rollNumber}
                      onChange={handleChange}
                      required
                      className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Department</label>
                    <input
                      type="text"
                      name="department"
                      value={formData.department}
                      onChange={handleChange}
                      required
                      className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Academic Year</label>
                    <input
                      type="text"
                      name="year"
                      value={formData.year}
                      onChange={handleChange}
                      placeholder="e.g. 3rd Year"
                      className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Semester</label>
                    <input
                      type="text"
                      name="semester"
                      value={formData.semester}
                      onChange={handleChange}
                      placeholder="e.g. 6th Semester"
                      className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">About / Bio</label>
                  <textarea
                    name="bio"
                    rows="3"
                    value={formData.bio}
                    onChange={handleChange}
                    className="w-full text-xs sm:text-sm px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                  ></textarea>
                </div>

                <div className="pt-3 flex items-center justify-end space-x-3">
                  <button
                    type="button"
                    onClick={() => setIsEditing(false)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-sm transition-colors"
                  >
                    Save Profile Changes
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
